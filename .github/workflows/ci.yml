name: CI
on: [push, pull_request]
jobs:
  tp1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # tout l'historique : git shortlog compte les deux auteurs
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Environnement virtuel et dÃ©pendances
        run: python -m venv .venv && . .venv/bin/activate && pip install pandas "scikit-learn==1.5.*" pytest "fastapi==0.115.*" "httpx==0.27.*" "uvicorn==0.30.*" "streamlit==1.39.*"
      - name: Diagnostic
        run: . .venv/bin/activate && python scripts/check_setup.py
      - name: ModÃ¨le de dÃ©monstration, pour les tests de l'API (TP3)
        run: . .venv/bin/activate && python src/make_demo.py && python src/train.py
      # TP4 (Ã©tape E) : quatre Ã©tapes de qualitÃ© Ã  la place de l'Ã©tape Â« Tests Â».
      - name: Outils de qualitÃ© (TP4)
        run: . .venv/bin/activate && pip install -r requirements-dev.txt
      - name: ruff
        run: . .venv/bin/activate && ruff check .
      - name: mypy
        run: . .venv/bin/activate && mypy api
      - name: Tests et couverture
        run: . .venv/bin/activate && pytest -q --cov=api --cov-report=term-missing --cov-fail-under=95
      - name: Roue installÃ©e hors du dÃ©pÃ´t (TP6)
        run: |
          . .venv/bin/activate && python -m build --wheel
          python -m venv /tmp/roue && /tmp/roue/bin/pip install dist/*.whl
          cd /tmp && SENTIMENT_MODELE="$GITHUB_WORKSPACE/models/sentiment.joblib" /tmp/roue/bin/sentiment predict "Livraison rapide, produit conforme, trÃ¨s satisfait"

  # Image Docker de l'API : construite, lancée, puis interrogée comme par un vrai client
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t sentiment-api .
      - name: Lancer le conteneur
        run: docker run -d --name api -p 8000:8000 -e API_KEYS="cle-ci-0123456789abcdef:client" sentiment-api
      - name: Attendre que l'API reponde
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/v1/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      - name: Essais de l'API dans le conteneur
        run: |
          curl -sf http://localhost:8000/v1/modele
          curl -sf -X POST http://localhost:8000/v1/predict/lot \
            -H "X-API-Key: cle-ci-0123456789abcdef" -H "Content-Type: application/json" \
            -d '{"avis": ["Livraison rapide, produit conforme, tres satisfait", "Produit casse, a fuir"]}' \
            | tee reponse.json
          grep -q '"total":2' reponse.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/v1/predict/lot \
            -H 'Content-Type: application/json' -d '{"avis": ["sans cle"]}')" = "401"
      - name: Arreter le conteneur
        if: always()
        run: docker rm -f api
